name: mirage_tea
description: "A magical space where multiple AI personas gather for tea party conversations"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # 数据存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.3.2
  
  # AI模型集成
  dio: ^5.4.3
  anthropic_sdk_dart: ^0.2.0
  google_generative_ai: ^0.2.2

  # 状态管理和响应式
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  
  # UI组件
  google_fonts: ^6.2.1
  animations: ^2.0.11
  flutter_animate: ^4.5.0
  
  # 工具类
  uuid: ^4.4.0
  collection: ^1.18.0
  async: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: false


